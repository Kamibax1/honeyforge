# HoneyForge — фронт центра: TLS-терминация, reverse-proxy, маскировка mgmt-API (MASK-2).
# Пути выглядят как обычный статический веб-ресурс/CDN, без «honeypot/api» в URL.

upstream center_api { server center:8000; }
upstream realtime_ws { server realtime:8090; }

server {
    listen 80;
    server_name _;

    # Dashboard оператора (статика UI)
    location / {
        root /srv/ui;
        index index.html;
    }

    # Control API спрятан под «asset metrics»-путём (MASK-2)
    location /assets/ {
        proxy_pass http://center_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger для разработки (в проде можно закрыть allow_from)
    location = /assets/docs { proxy_pass http://center_api/docs; }
    location = /assets/openapi.json { proxy_pass http://center_api/openapi.json; }

    # WebSocket ленты событий dashboard'а
    location /static/rt {
        proxy_pass http://realtime_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Beacon-путь агентов тоже можно проксировать через nginx, если агенты
    # ходят не напрямую на realtime-слой (см. HFD_CENTER_URL у агента).
    location /static/js/analytics.js {
        proxy_pass http://realtime_ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

